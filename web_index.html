<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FotoMates · Meter readings</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#f3f6fa;
    color:#172033;font:16px Arial,sans-serif
}
main
{
    max-width:1120px;
    margin:5vh auto;
    padding:24px
}
h1{
    margin:8px 0
}
h2{
    font-size:22px
}
p,.muted{
    color:#58657a;
    line-height:1.5
}.brand{
    color:#1769e0;
    font-weight:bold;
    letter-spacing:2px;
    font-size:13px}.drop{
        display:block;
        margin:24px 0 14px;
        padding:40px 20px;
        border:3px dashed #7183a3;
        border-radius:18px;
        background:white;
        text-align:center;
        cursor:pointer
    }.drop.over,.drop:focus-within{
        border-color:#1769e0;
        background:#edf5ff}.drop input{display:block;max-width:100%;margin:18px auto 0}.drop strong{font-size:20px}button,.link{display:inline-block;padding:12px 18px;border:0;border-radius:8px;background:#1769e0;color:white;font-weight:bold;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e5edf8;color:#234b80}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin:20px 0}.card{background:white;border:1px solid #dbe3ee;border-radius:14px;overflow:hidden}.card img{width:100%;height:240px;object-fit:contain;background:#eaf0f7}.body{padding:18px;overflow-wrap:anywhere}.filename{font-weight:bold}.reading{font:700 32px monospace;margin:16px 0;color:#1454aa;overflow-wrap:anywhere}.digits{display:flex;flex-wrap:wrap;gap:5px}.digit{font:22px monospace;padding:7px;background:#edf5ff;border-radius:5px}.error{color:#a22d2d}#status{min-height:24px;margin:16px 0}details{margin-top:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.history-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #dbe3ee}.history-row span{overflow-wrap:anywhere}small{display:block;margin-top:6px;color:#58657a}[hidden]{display:none!important}
.comparison{display:grid;grid-template-columns:1fr 1fr;gap:8px}.comparison figure{margin:0}.comparison figcaption{font-size:12px;color:#58657a;padding:8px}.comparison img{height:200px}.review{background:#fff3d8;color:#734f00;padding:10px;border-radius:6px}.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,450px),1fr))}
@media print{body{background:white}main{margin:0;max-width:none;padding:0}.brand,#upload,#status,#history,button,#download,main>p{display:none!important}.grid{display:block}.card{break-inside:avoid;margin:0 0 20px;border:1px solid #aaa}.comparison img{height:240px}.reading{color:black}.digit{background:white;border:1px solid #ccc}.comparison{grid-template-columns:1fr 1fr}details{display:none}}
.comparison.original-only{grid-template-columns:1fr}.comparison.original-only img{height:320px}</style></head><body><main>
<div class="brand">FOTOMATES</div><h1>Read your meter photos</h1>
<p>Upload meter photos or display crops. Review the complete reading and every detected digit, including leading zeros.</p>
<form id="upload"><label class="drop" id="drop"><strong>Drop photos here or choose files</strong><br><span class="muted">JPG, PNG, WebP, BMP or TIFF · Up to 30 images / 50 MB per batch</span><input id="files" type="file" accept=".jpg,.jpeg,.png,.webp,.bmp,.tif,.tiff" multiple required></label>
<div class="toolbar"><button id="submit">Detect digits</button><button type="button" class="secondary" id="historyButton">Upload history</button><span id="selection" class="muted"></span></div></form>
<div id="status" role="status" aria-live="polite"></div>
<section id="results" hidden><div class="toolbar"><h2>Detected readings</h2><button class="secondary" id="print">Print images &amp; results</button><a id="download" class="link secondary">Download JSON</a><button id="rerun" class="secondary">Re-upload this batch</button></div><p id="summary"></p><div class="grid" id="cards"></div></section>
<section id="history" hidden><h2>Upload history</h2><div id="historyRows"></div></section>
</main><script>
const $=id=>document.getElementById(id);let activeJob=null,timer=null,busy=false;
const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('print').onclick=async()=>{
const button=$('print');button.disabled=true;
try{await Promise.all(Array.from($('cards').querySelectorAll('img')).map(img=>img.decode()));window.print()}
catch(e){status('An image could not load. Printing paused so the enhanced photo is not omitted. Reload and try again.',true)}
finally{button.disabled=false}
};
async function api(url,options){
    const response=await fetch(url,options);
    const data=await response.json();if(!response.ok)
    throw Error(data.error||'Request failed');return data}
function status(message,error=false){$('status').textContent=message;$('status').className=error?'error':''}
function selected(){ $('selection').textContent=`${$('files').files.length} photo(s) selected` }
$('files').onchange=selected;
for(const event of ['dragenter','dragover'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.add('over')});
for(const event of ['dragleave','drop'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.remove('over')});
$('drop').addEventListener('drop',e=>{$('files').files=e.dataTransfer.files;selected()});
async function upload(files){if(busy)return;if(!files.length||files.length>30){status('Choose between 1 and 30 images.',true);return}if(files.reduce((n,f)=>n+f.size,0)>50*1024*1024){status('Choose a batch smaller than 50 MB.',true);return}busy=true;$('submit').disabled=true;$('rerun').disabled=true;status('Uploading photos…');const body=new FormData();files.forEach(f=>body.append('images',f));try{const job=await api('/api/upload',{method:'POST',body});location.hash=job.id;await showJob(job.id)}catch(e){status(e.message,true)}finally{busy=false;$('submit').disabled=false;$('rerun').disabled=false}}
$('upload').onsubmit=e=>{e.preventDefault();upload(Array.from($('files').files))};
let lastRendered=null;
function render(job){activeJob=job;$('results').hidden=false;$('history').hidden=true;const fingerprint=JSON.stringify(job);if(fingerprint===lastRendered)return;lastRendered=fingerprint;$('download').href=`/api/jobs/${job.id}`;$('download').download=`fotomates-${job.id}.json`;const complete=job.images.filter(i=>!['queued','processing'].includes(i.status)).length;const digits=job.images.reduce((n,i)=>n+(i.digits?.length||0),0);$('summary').textContent=`${complete} of ${job.images.length} photos processed · ${digits} digits detected`;
$('cards').innerHTML=job.images.map((i,index)=>`<article class="card"><div class="comparison"><figure><a href="/images/${job.id}/${i.image}" target="_blank" rel="noopener"><img src="/images/${job.id}/${i.image}" alt="Original: ${escape(i.filename)}"></a><figcaption>Original photo</figcaption></figure><figure class="enhanced-figure"><a href="/enhanced/${job.id}/${i.image}" target="_blank" rel="noopener"><img src="/enhanced/${job.id}/${i.image}" alt="Enhanced: ${escape(i.filename)}" loading="eager" onerror="this.closest('.comparison').classList.add('original-only');this.closest('figure').remove()"></a><figcaption>Enhanced photo</figcaption></figure></div><div class="body"><div class="filename">${escape(i.filename)}</div><div class="reading">${escape(i.reading||({queued:'Queued',processing:'Reading…',no_digits:'No digits found',error:'Processing failed'}[i.status]||''))}</div><div class="digits" aria-label="Individual digits">${Array.from(i.reading||'').map(c=>`<span class="digit">${escape(c)}</span>`).join('')}</div><details><summary>Model response</summary><pre>${escape(i.raw_text)}</pre></details>${i.error?`<p class="error">${escape(i.error)}</p>`:''}<button class="secondary" data-replace="${index}">Upload replacement</button><button class="secondary" data-delete="${i.image}">Delete</button></div></article>`).join('');
$('cards').querySelectorAll('[data-replace]').forEach(button=>button.onclick=()=>{const input=document.createElement('input');input.type='file';input.accept=$('files').accept;input.onchange=()=>upload(Array.from(input.files));input.click()});
$('cards').querySelectorAll('[data-delete]').forEach(button=>button.onclick=async()=>{if(!confirm('Delete this reading?'))return;try{await api(`/api/jobs/${activeJob.id}/images/${button.dataset.delete}`,{method:'DELETE'});await showJob(activeJob.id)}catch(e){status(e.message,true)}});
status(['queued','processing'].includes(job.status)?'Reading photos… Results appear as each photo finishes. You can upload another batch.':job.status==='interrupted'?'Processing was interrupted. Re-upload to finish.':'');}
async function showJob(id){clearTimeout(timer);if(activeJob&&activeJob.id!==id)lastRendered=null;try{const job=await api(`/api/jobs/${id}`);if(location.hash.slice(1)!==id)return;render(job);if(['queued','processing'].includes(job.status))timer=setTimeout(()=>showJob(id),1500)}catch(e){status(e.message,true)}}
$('rerun').onclick=async()=>{if(!activeJob||busy)return;const job=activeJob;try{status('Preparing re-upload…');const files=await Promise.all(job.images.map(async i=>{const response=await fetch(`/images/${job.id}/${i.image}`);if(!response.ok)throw Error('Could not load saved photo');return new File([await response.blob()],i.filename,{type:'image/png'})}));await upload(files)}catch(e){status(e.message,true)}};
async function showHistory(){clearTimeout(timer);location.hash='';$('results').hidden=true;$('history').hidden=false;try{const jobs=await api('/api/jobs');$('historyRows').innerHTML=jobs.length?jobs.map(j=>`<div class="history-row"><span>${escape(j.images.map(i=>i.filename).join(', '))}<small>${escape(new Date(j.created_at).toLocaleString())} · ${escape(j.status)}</small></span><span class="toolbar"><a class="link secondary" href="#${j.id}">View</a><button class="secondary" data-delete-job="${j.id}">Delete</button></span></div>`).join(''):'<p>No uploads yet.</p>';$('historyRows').querySelectorAll('[data-delete-job]').forEach(button=>button.onclick=async()=>{if(!confirm('Delete this upload?'))return;try{await api(`/api/jobs/${button.dataset.deleteJob}`,{method:'DELETE'});await showHistory()}catch(e){status(e.message,true)}});status('')}catch(e){status(e.message,true)}}
$('historyButton').onclick=showHistory;
window.onhashchange=()=>{const id=location.hash.slice(1);if(/^[a-f0-9]{32}$/.test(id))showJob(id)};window.onhashchange();
</script></body></html>
