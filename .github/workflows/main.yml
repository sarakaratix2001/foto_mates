name: Build and Push to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: dev3i

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure CLI Login (using Service Principal Secret)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push fotomates image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/fotomates:latest
          cache-from: type=gha,scope=fotomates
          cache-to: type=gha,mode=max,scope=fotomates
